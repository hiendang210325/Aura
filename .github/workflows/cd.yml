name: CD

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build release package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Prepare backend package
        run: |
          mkdir -p release/backend release/frontend
          rsync -a \
            --exclude node_modules \
            --exclude .env \
            backend/ release/backend/
          rsync -a frontend/dist/ release/frontend/dist/

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-release
          path: release
          retention-days: 14

  deploy-ssh:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    needs: package
    if: ${{ vars.ENABLE_SSH_DEPLOY == 'true' }}

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: aura-release
          path: release

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload release files
        run: |
          rsync -az --delete release/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_TARGET_DIR }}"

      - name: Restart application
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "${{ secrets.SSH_RESTART_COMMAND }}"
